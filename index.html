<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>APL — Ainzo Programming Language</title>
  <script defer src="web_ide.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 {
      font-size: 1.3rem;
      color: #58a6ff;
      font-weight: 700;
      letter-spacing: 1px;
    }

    header span {
      background: #238636;
      color: #fff;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 600;
    }

    .editor-area {
      display: flex;
      flex: 1;
      gap: 0;
      height: calc(100vh - 60px);
    }

    .left-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #30363d;
    }

    .panel-header {
      background: #161b22;
      padding: 10px 16px;
      font-size: 0.75rem;
      color: #8b949e;
      border-bottom: 1px solid #30363d;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-header .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #58a6ff;
      display: inline-block;
      margin-right: 6px;
    }

    #code-input {
      flex: 1;
      background: #0d1117;
      color: #c9d1d9;
      border: none;
      outline: none;
      padding: 20px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 15px;
      line-height: 1.7;
      resize: none;
      tab-size: 2;
    }

    #code-input::placeholder {
      color: #3d444d;
    }

    .right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    #output {
      flex: 1;
      background: #0d1117;
      color: #3fb950;
      padding: 20px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 15px;
      line-height: 1.7;
      overflow-y: auto;
      white-space: pre-wrap;
      min-height: 0;
    }

    .toolbar {
      background: #161b22;
      border-top: 1px solid #30363d;
      padding: 12px 20px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    button {
      padding: 8px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.85; }

    #run-btn {
      background: #238636;
      color: #fff;
    }

    #clear-btn {
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
    }

    .hint {
      font-size: 0.75rem;
      color: #8b949e;
      margin-left: auto;
    }

    .example-btn {
      background: #1f3a5f;
      color: #58a6ff;
      border: 1px solid #1f6feb;
      font-size: 0.8rem;
      padding: 6px 14px;
    }
  </style>
</head>
<body>

  <header>
    <h1>⚡ APL</h1>
    <span>v1.0</span>
    <span style="background:#1f3a5f; color:#58a6ff;">Ainzo Programming Language</span>
  </header>

  <div class="editor-area">

    <div class="left-panel">
      <div class="panel-header">
        <div><span class="dot"></span>editor.apl</div>
        <button class="example-btn" onclick="loadExample()">Load Example</button>
      </div>
      <textarea id="code-input" placeholder="Write your APL code here...
Example:
v int x = 5
print x"></textarea>
    </div>

    <div class="right-panel">
      <div class="panel-header">
        <div><span class="dot" style="background:#3fb950"></span>output</div>
      </div>
      <pre id="output"></pre>
      <div class="toolbar">
        <button id="run-btn">▶ Run</button>
        <button id="clear-btn">✕ Clear</button>
        <span class="hint">Ctrl+Enter to run</span>
      </div>
    </div>

  </div>

  <script>
    // Ctrl+Enter to run
    document.getElementById('code-input').addEventListener('keydown', function(e) {
      if (e.ctrlKey && e.key === 'Enter') {
        document.getElementById('run-btn').click();
      }
    });

    function loadExample() {
      document.getElementById('code-input').value =
`v int x = 1
Loop x < 6 {
n v x = x + 1
print x
}`;
    }
  </script>

</body>
</html>
